<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>APEX FALL - The Infinite Risk Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050d;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 540px;
      max-height: 960px;
      aspect-ratio: 9/16;
      background: radial-gradient(circle at 50% 30%, #150d2a 0%, #060511 100%);
      box-shadow: 0 0 50px rgba(180, 0, 255, 0.25), 0 0 20px rgba(0, 240, 255, 0.2);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-stat-left {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }
    .hud-floor {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .hud-best {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa00;
      letter-spacing: 1px;
      margin-top: 3px;
      opacity: 0.85;
    }
    .hud-stat-right {
      text-align: right;
      text-shadow: 0 0 14px rgba(255, 0, 128, 0.8);
    }
    .hud-multiplier {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #ff007f;
      line-height: 1;
    }
    .hud-sparks {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #00ffcc;
      margin-top: 3px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }

    /* Minimalist Vertical Overdrive Energy Tube */
    .overdrive-container {
      position: absolute;
      right: 18px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .tube-wrapper {
      position: relative;
      width: 14px;
      height: 140px;
      background: rgba(10, 8, 25, 0.6);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    .tube-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, #00f0ff 0%, #ff00aa 70%, #ffaa00 100%);
      box-shadow: 0 0 14px rgba(255, 170, 0, 0.8);
      transition: height 0.12s ease-out;
      border-radius: 8px;
    }
    .tube-label {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 900;
      color: #ffaa00;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
    }

    /* Pulsing Hyper Rocket Trigger Button */
    #btn-rocket {
      display: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0055 0%, #ffaa00 100%);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8), 0 0 45px rgba(255, 170, 0, 0.6);
      animation: rocketPulse 0.8s infinite alternate ease-in-out;
      align-items: center;
      justify-content: center;
    }
    @keyframes rocketPulse {
      0% { transform: scale(0.95); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
      100% { transform: scale(1.12); box-shadow: 0 0 40px rgba(255, 170, 0, 1); }
    }

    #screen-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 85%;
      pointer-events: auto;
      z-index: 10;
    }
    .btn-action {
      background: linear-gradient(135deg, #ff007f 0%, #00f0ff 100%);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      transition: transform 0.15s;
      letter-spacing: 1px;
      margin-top: 15px;
    }
    .btn-action:hover {
      transform: scale(1.05);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-top">
        <div class="hud-stat-left">
          <div class="hud-floor" id="hud-floor">0F</div>
          <div class="hud-best" id="hud-best">BEST 0F</div>
        </div>
        <div class="hud-stat-right">
          <div class="hud-multiplier" id="hud-multiplier">x1.0</div>
          <div class="hud-sparks" id="hud-sparks">💎 0</div>
        </div>
      </div>

      <!-- Minimalist Overdrive Tube -->
      <div class="overdrive-container">
        <button id="btn-rocket" title="Rocket Overdrive [E]">🚀</button>
        <div class="tube-wrapper">
          <div class="tube-fill" id="tube-fill"></div>
        </div>
        <div class="tube-label" id="tube-label">⚡0%</div>
      </div>

      <div id="screen-msg"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
