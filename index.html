<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>APEX FALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020108;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      max-height: 960px;
      background: #05020c;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 500px) {
      #game-container {
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-stat-left {
      display: flex;
      flex-direction: column;
    }
    .hud-title-tag {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 900;
      color: #ff007f;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .hud-depth {
      font-family: 'Orbitron', monospace;
      font-size: 30px;
      font-weight: 900;
      color: #00f0ff;
      line-height: 1;
    }
    .hud-best {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa00;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    .hud-stat-right {
      text-align: right;
    }
    .hud-multiplier {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #ff007f;
      line-height: 1;
    }
    .hud-gems {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #ffe600;
      margin-top: 3px;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn-tilt {
      background: rgba(14, 8, 30, 0.75);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.15s ease;
    }
    .btn-tilt.active {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #04020a;
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
    }

    /* Plunge Button for Mobile */
    .btn-plunge {
      background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
      border: 1.5px solid #ffffff;
      color: #ffffff;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.5);
    }
    .btn-plunge:active {
      transform: scale(0.95);
    }

    .meteor-meter-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .meteor-label {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 900;
      color: #ffaa00;
      letter-spacing: 0.5px;
    }
    .meteor-dots {
      display: flex;
      gap: 5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(30, 15, 45, 0.7);
      border: 1.5px solid rgba(255, 170, 0, 0.35);
      transition: all 0.12s ease;
    }
    .dot.active {
      background: #ff5500;
      border-color: #ffff00;
      transform: scale(1.15);
    }
    .dot.fire {
      background: #ff0055;
      border-color: #ffffff;
      box-shadow: 0 0 12px #ff0055;
      animation: firePulse 0.45s infinite alternate;
    }
    @keyframes firePulse {
      0% { transform: scale(1.1); }
      100% { transform: scale(1.3); }
    }

    #screen-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 88%;
      pointer-events: auto;
      z-index: 10;
    }
    .btn-action {
      background: linear-gradient(135deg, #ff007f 0%, #00f0ff 100%);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      padding: 14px 30px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.5);
      transition: transform 0.15s;
      letter-spacing: 1px;
      margin-top: 15px;
    }
    .btn-action:hover {
      transform: scale(1.04);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-top">
        <div class="hud-stat-left">
          <div class="hud-title-tag">APEX FALL</div>
          <div class="hud-depth" id="hud-depth">0M</div>
          <div class="hud-best" id="hud-best">BEST 0M</div>
        </div>
        <div class="hud-stat-right">
          <div class="hud-multiplier" id="hud-multiplier">x1.0</div>
          <div class="hud-gems" id="hud-gems">💎 0</div>
        </div>
      </div>

      <div class="hud-bottom">
        <button id="btn-tilt" class="btn-tilt" title="Ters Jiroskop">📱 TİLT: KAPALI</button>
        <button id="btn-plunge" class="btn-plunge" title="Hızlı Dalış [Space/Aşağı]">⚡ HIZLI DALIŞ</button>
        <div class="meteor-meter-container">
          <div class="meteor-label" id="meteor-label">METEOR STREAK</div>
          <div class="meteor-dots">
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
          </div>
        </div>
      </div>

      <div id="screen-msg"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
