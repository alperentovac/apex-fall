<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>APEX FALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020108;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 900px;
      background: #03010b;
      border-radius: 36px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.22), inset 0 0 25px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 500px) {
      #game-container {
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 10px 20px;
    }

    /* Top HUD: Exactly matching 1.png */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
      z-index: 5;
    }
    .hud-stat-left {
      display: flex;
      flex-direction: column;
    }
    .hud-label {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 3px;
    }
    .hud-speed-val {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      line-height: 1;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
      transition: color 0.2s ease;
    }
    .hud-speed-val.boosted {
      color: #ffe600;
      text-shadow: 0 0 16px #ffe600;
      animation: speedPulse 0.4s alternate infinite;
    }
    @keyframes speedPulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    .hud-speed-meter {
      display: flex;
      gap: 3px;
      margin-top: 5px;
    }
    .speed-tick {
      width: 14px;
      height: 4.5px;
      border-radius: 2px;
      background: rgba(0, 240, 255, 0.2);
      transition: all 0.15s ease;
    }
    .speed-tick.active {
      background: #00f0ff;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.9);
    }

    .hud-top-center {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hud-shields {
      font-size: 13px;
      letter-spacing: 2px;
      background: rgba(14, 8, 32, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 14px;
      padding: 3px 8px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      white-space: nowrap;
      line-height: 1;
    }
    .hud-timer {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #ffe600;
      background: rgba(20, 10, 40, 0.7);
      border: 1px solid rgba(255, 230, 0, 0.35);
      border-radius: 14px;
      padding: 3px 8px;
      backdrop-filter: blur(4px);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .hud-timer.urgent {
      color: #ff0055;
      border-color: #ff0055;
      text-shadow: 0 0 10px #ff0055;
      animation: timerPulse 0.45s infinite alternate ease-in-out;
    }
    @keyframes timerPulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    .btn-top-icon {
      background: rgba(20, 10, 40, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      font-size: 13px;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .btn-top-icon:active {
      transform: scale(0.92);
    }

    .hud-stat-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .hud-score-val {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      margin-bottom: 6px;
    }
    .hud-combo-label {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 1.5px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .hud-combo-val {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      color: #f59e0b;
      line-height: 1;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
    }

    /* 4-Way Cyber Controller & Navigation Guidance: Left/Right/Up/Down */
    .bottom-controller {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      margin-bottom: 4px;
      z-index: 5;
      gap: 6px;
    }

    /* 4-Way D-Pad Layout */
    .dpad-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .dpad-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dpad-btn {
      position: relative;
      background: rgba(14, 8, 32, 0.82);
      border: 1.5px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      transition: all 0.12s ease;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.active {
      transform: scale(0.92);
      background: rgba(0, 240, 255, 0.3);
      border-color: #ffffff;
    }

    /* Up / Süzül (W / Yukarı Ok) */
    .dpad-up {
      width: 130px;
      height: 38px;
      border-color: rgba(0, 240, 255, 0.5);
    }
    .dpad-up.active {
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.45), rgba(168, 85, 247, 0.2));
      border-color: #00f0ff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
    }

    /* Down / Dalış (S / Aşağı Ok) */
    .dpad-down {
      width: 130px;
      height: 38px;
      border-color: rgba(245, 158, 11, 0.5);
    }
    .dpad-down.active {
      background: linear-gradient(180deg, rgba(255, 68, 0, 0.5), rgba(245, 158, 11, 0.25));
      border-color: #ffaa00;
      box-shadow: 0 0 16px rgba(255, 100, 0, 0.75);
    }

    /* Left / Sol (A / Sol Ok) */
    .dpad-left {
      width: 85px;
      height: 44px;
      border-color: rgba(0, 240, 255, 0.4);
    }
    .dpad-left.guided {
      border-color: #00f0ff;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.9);
      animation: guidePulseCyan 0.35s infinite alternate ease-in-out;
    }
    @keyframes guidePulseCyan {
      from { transform: scale(1); background: rgba(0, 240, 255, 0.2); }
      to { transform: scale(1.08); background: rgba(0, 240, 255, 0.45); }
    }

    /* Right / Sağ (D / Sağ Ok) */
    .dpad-right {
      width: 85px;
      height: 44px;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .dpad-right.guided {
      border-color: #f59e0b;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.9);
      animation: guidePulseGold 0.35s infinite alternate ease-in-out;
    }
    @keyframes guidePulseGold {
      from { transform: scale(1); background: rgba(245, 158, 11, 0.2); }
      to { transform: scale(1.08); background: rgba(245, 158, 11, 0.45); }
    }

    /* Center Guide Status Badge */
    .dpad-center {
      width: 90px;
      height: 44px;
      background: rgba(8, 4, 20, 0.7);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .dpad-center.safe {
      border-color: #39ff14;
      border-style: solid;
      box-shadow: 0 0 14px rgba(57, 255, 20, 0.5);
    }
    .dpad-guide-text {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #39ff14;
    }
    .dpad-guide-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .dpad-icon {
      font-size: 14px;
      line-height: 1;
    }
    .dpad-label {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }
    .dpad-key {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
    }

    /* Arc Dial & Instructions */
    .steering-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .steering-dial {
      position: relative;
      width: 120px;
      height: 52px;
    }
    .steering-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .steering-marker {
      position: absolute;
      top: 10px;
      left: 60px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 16px #00f0ff;
      pointer-events: none;
      transition: transform 0.08s ease-out;
    }
    .steering-instructions {
      text-align: center;
      margin-top: 2px;
    }
    .ctrl-desc {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 1px;
      line-height: 1.15;
    }

    #screen-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 88%;
      pointer-events: auto;
      z-index: 10;
    }
    .btn-action {
      background: linear-gradient(135deg, #00f0ff 0%, #a855f7 50%, #f59e0b 100%);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 900;
      padding: 13px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.6);
      transition: transform 0.15s;
      letter-spacing: 1px;
      margin-top: 15px;
    }
    .btn-action:hover {
      transform: scale(1.04);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
  <script type="module" crossorigin src="./assets/index-B7pK9mJz.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <!-- Top HUD matching 1.png with speed multiplier progression -->
      <div class="hud-top">
        <div class="hud-stat-left">
          <div class="hud-label">HIZ</div>
          <div class="hud-speed-val" id="hud-speed">x1.0</div>
          <div class="hud-speed-meter" id="hud-speed-meter">
            <span class="speed-tick active" id="tick-1"></span>
            <span class="speed-tick" id="tick-2"></span>
            <span class="speed-tick" id="tick-3"></span>
            <span class="speed-tick" id="tick-4"></span>
          </div>
        </div>
        <div class="hud-top-center">
          <div class="hud-shields" id="hud-shields" title="Kozmik Kalkanlar">🛡️🛡️🛡️</div>
          <div class="hud-timer" id="hud-timer">⏱️ 35.0s</div>
          <button id="btn-restart-top" class="btn-top-icon" title="Yeniden Başlat">🔄</button>
        </div>
        <div class="hud-stat-right">
          <div class="hud-label">SKOR</div>
          <div class="hud-score-val" id="hud-score">0</div>
          <div class="hud-combo-label">KOMBO</div>
          <div class="hud-combo-val" id="hud-combo">x1</div>
        </div>
      </div>

      <!-- Bottom 4-Way Cyber Controller & Guidance (Sol / Sağ / Yukarı / Aşağı + WASD) -->
      <div class="bottom-controller">
        <div class="dpad-cluster">
          <!-- Yukarı: W / Süzül (Air-Brake Glide) -->
          <button class="dpad-btn dpad-up" id="btn-up" title="Süzül / Yavaşla (W veya Yukarı Ok)">
            <span class="dpad-icon">▲</span>
            <span class="dpad-label">W • SÜZÜL</span>
          </button>

          <!-- Orta Sıra: Sol (A) - Güvenli Yol Rehberi - Sağ (D) -->
          <div class="dpad-row">
            <button class="dpad-btn dpad-left" id="btn-left" title="Sola Süzül (A veya Sol Ok)">
              <span class="dpad-icon">◀</span>
              <span class="dpad-label">A • SOL</span>
            </button>

            <!-- Dinamik Güvenli Yol Rehber Rozeti (Okları takip et -> engelsiz geç!) -->
            <div class="dpad-center" id="dpad-center">
              <div class="dpad-guide-text" id="dpad-guide-text">HİZALAN</div>
              <div class="dpad-guide-sub" id="dpad-guide-sub">GÜVENLİ YOL</div>
            </div>

            <button class="dpad-btn dpad-right" id="btn-right" title="Sağa Süzül (D veya Sağ Ok)">
              <span class="dpad-icon">▶</span>
              <span class="dpad-label">D • SAĞ</span>
            </button>
          </div>

          <!-- Aşağı: S / Dalış (Slam Dive) -->
          <button class="dpad-btn dpad-down" id="btn-down" title="Hızlı Dalış Yap (S veya Aşağı Ok)">
            <span class="dpad-icon">▼</span>
            <span class="dpad-label">S • DALIŞ</span>
          </button>
        </div>

        <!-- 1.png Yay İbresi & Kaydırma İpucu -->
        <div class="steering-widget" id="steering-widget">
          <div class="steering-dial">
            <svg class="steering-svg" viewBox="0 0 120 52">
              <defs>
                <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <path d="M 18 44 A 42 42 0 0 1 60 10" stroke="#00f0ff" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
              <path d="M 60 10 A 42 42 0 0 1 102 44" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow-gold)" />
              <polygon points="10,40 20,34 20,46" fill="#00f0ff" />
              <polygon points="110,40 100,34 100,46" fill="#f59e0b" />
            </svg>
            <div class="steering-marker" id="steering-marker"></div>
          </div>
          <div class="steering-instructions">
            <div class="ctrl-desc">DOKUNMATİKTE 4 YÖNE KAYDIR / WASD İLE YÖNET</div>
          </div>
        </div>
      </div>

      <div id="screen-msg"></div>
    </div>
  </div>
</body>
</html>
