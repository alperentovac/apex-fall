<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>VORTEX DIVE - Infinite Neon Freefall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04020a;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 540px;
      max-height: 960px;
      aspect-ratio: 9/16;
      background: radial-gradient(circle at 50% 40%, #15092a 0%, #05020c 100%);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), 0 0 25px rgba(255, 0, 128, 0.2);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-stat-left {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }
    .hud-depth {
      font-family: 'Orbitron', monospace;
      font-size: 32px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .hud-best {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa00;
      letter-spacing: 1px;
      margin-top: 3px;
      opacity: 0.85;
    }
    .hud-stat-right {
      text-align: right;
      text-shadow: 0 0 14px rgba(255, 0, 128, 0.8);
    }
    .hud-multiplier {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #ff007f;
      line-height: 1;
    }
    .hud-gems {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #00ffcc;
      margin-top: 3px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }

    /* Controls & Gyro Tilt Toggle */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn-tilt {
      background: rgba(15, 10, 32, 0.7);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      transition: all 0.2s ease;
    }
    .btn-tilt.active {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      color: #050512;
      border-color: #ffffff;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.7);
    }

    /* Meteor Dive Status Bar */
    .meteor-meter-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .meteor-label {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 900;
      color: #ffaa00;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
      letter-spacing: 1px;
    }
    .meteor-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(40, 20, 60, 0.6);
      border: 1.5px solid rgba(255, 170, 0, 0.4);
      transition: all 0.15s ease;
    }
    .dot.active {
      background: #ff5500;
      border-color: #ffff00;
      box-shadow: 0 0 10px #ff3300;
      transform: scale(1.15);
    }
    .dot.fire {
      background: #ff0055;
      border-color: #ffffff;
      box-shadow: 0 0 16px #ff0055, 0 0 25px #ffaa00;
      animation: firePulse 0.5s infinite alternate;
    }
    @keyframes firePulse {
      0% { transform: scale(1.1); box-shadow: 0 0 12px #ff0055; }
      100% { transform: scale(1.35); box-shadow: 0 0 22px #ffaa00; }
    }

    #screen-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 88%;
      pointer-events: auto;
      z-index: 10;
    }
    .btn-action {
      background: linear-gradient(135deg, #ff007f 0%, #00f0ff 100%);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 900;
      padding: 15px 32px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.65);
      transition: transform 0.15s;
      letter-spacing: 1.5px;
      margin-top: 16px;
    }
    .btn-action:hover {
      transform: scale(1.05);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-top">
        <div class="hud-stat-left">
          <div class="hud-depth" id="hud-depth">0M</div>
          <div class="hud-best" id="hud-best">BEST 0M</div>
        </div>
        <div class="hud-stat-right">
          <div class="hud-multiplier" id="hud-multiplier">x1.0</div>
          <div class="hud-gems" id="hud-gems">💎 0</div>
        </div>
      </div>

      <div class="hud-bottom">
        <button id="btn-tilt" class="btn-tilt" title="Cihaz Eğme (Jiroskop) Kontrolü">📱 TİLT: KAPALI</button>
        <div class="meteor-meter-container">
          <div class="meteor-label" id="meteor-label">METEOR DIVE</div>
          <div class="meteor-dots">
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
          </div>
        </div>
      </div>

      <div id="screen-msg"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
